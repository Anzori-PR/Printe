<div class="max-w-4xl mx-auto py-10 px-4">

  <div class="flex items-center justify-between mb-12 relative">
    <div class="absolute left-0 top-1/2 w-full h-1 bg-gray-200 -z-10"></div>

    <div *ngFor="let step of steps" class="flex flex-col items-center bg-white px-2">
      <div
        class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg border-2 transition-colors duration-300"
        [ngClass]="{
          'bg-primary border-primary text-black': currentStep >= step.number,
          'bg-white border-gray-300 text-gray-400': currentStep < step.number
        }">
        {{ step.number }}
      </div>
      <span class="text-sm mt-2 font-medium" [ngClass]="currentStep >= step.number ? 'text-primary' : 'text-gray-400'">
        {{ step.title }}
      </span>
    </div>
  </div>


  <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-6 md:p-10 min-h-100">

    @if(currentStep === 1) {
    <app-product-selector (productSelected)="onProductSelected($event)">
    </app-product-selector>

    <div class="flex justify-end">
      <button (click)="nextStep()" [disabled]="orderData.selectedProduct == null"
        class="btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
        გაგრძელება →
      </button>
    </div>
    }

    @if (currentStep === 2) {
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-charcoal">ატვირთე შენი მოგონებები</h2>

      <div class="relative inline-block">

        <button (click)="togglePopover()"
          class="w-12 h-12 flex items-center justify-center rounded-full border cursor-pointer border-gray-100 bg-white  hover:bg-gray-50 hover:border-gray-200 hover:text-black transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
            class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
          </svg>
        </button>

        <div *ngIf="isOpen"
          class="absolute top-0 right-15 w-72 bg-white border border-purple-100 shadow-xl rounded-2xl p-5 z-20 animate-fade-in">
          <div class="flex flex-col gap-1">
            <h3 class="text-lg font-bold text-gray-800">გაითვალისწინეთ</h3>
            <p class="text-gray-600 text-sm leading-relaxed">
              ფოტოები ედიტორში ინახება 3 დღის განმავლობაში
            </p>
          </div>
        </div>
        <div *ngIf="isOpen" (click)="isOpen = false" class="fixed inset-0 z-10"></div>
      </div>
    </div>

    <app-file-uploader (filesChanged)="onFilesUpdated($event)">
    </app-file-uploader>

    <div class="flex justify-between mt-8 border-t border-gray-200 pt-6">
      <button (click)="prevStep()" class="text-gray-500 font-medium hover:text-charcoal cursor-pointer">
        ← უკან
      </button>
      <button (click)="nextStep()" [disabled]="orderData.uploadedFiles.length <= 5"
        class="btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
        გაგრძელება →
      </button>
    </div>
    }

    @if(currentStep === 3) {
    <div>
      <h2 class="text-2xl font-bold text-charcoal mb-6">შეკვეთის დასრულება</h2>

      <div class="grid md:grid-cols-2 gap-8">
        <app-checkout-form></app-checkout-form>

        <div class="bg-gray-50 p-6 rounded-xl h-fit">
          <h3 class="font-bold text-lg mb-4">შენი შეკვეთა</h3>
          <table class="w-full">
            <tr class="flex justify-between mb-2">
              <th>პროდუქტი</th>
              <th>ფასი</th>
              <th>სულ</th>
              <th></th>
            </tr>
            <tr class="border-t border-gray-200 py-2 flex justify-between">
              <td class="py-2">ფოტოალბომი</td>
              <td class="py-2">0.25 ₾</td>
              <td class="py-2">25.00 ₾</td>
              <td class="py-2"> <fa-icon class="hovershow" [icon]="faTrash" /> </td>
            </tr>
          </table>

          <div class="border-t my-4"></div>
          <p class="flex justify-between text-xl font-bold text-primary">
            <span>სულ:</span>
            <span>25.00 ₾</span>
          </p>
        </div>
      </div>

      <div class="flex justify-between mt-8 border-t border-gray-200 pt-6">
        <button (click)="prevStep()" class="mt-4 text-gray-500">← უკან</button>
      </div>
    </div>
    }

  </div>

</div>
