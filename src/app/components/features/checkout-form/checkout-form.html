<form [formGroup]="checkoutForm" (ngSubmit)="submit()" class="w-full max-w-xl space-y-4 text-gray-800">

    <!-- სახელი + გვარი -->
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-xs text-gray-500 mb-1">სახელი</label>
            <input type="text" name="name" placeholder="სახელი" formControlName="name" [ngClass]="{'border-red-500': checkoutForm.get('name')?.invalid && checkoutForm.get('name')?.touched}"
                class="w-full rounded-lg bg-gray-50 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500" 
                />
        </div>

        <div>
            <label class="block text-xs text-gray-500 mb-1">გვარი</label>
            <input type="text" placeholder="გვარი" required formControlName="surname"
                class="w-full rounded-lg bg-gray-50 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500" />
        </div>
    </div>

    <!-- ტელეფონი -->
    <div>
        <label class="block text-xs text-gray-500 mb-1">ტელეფონი</label>
        <input type="tel" placeholder="+995 5XX XX XX XX" formControlName="phone"
            class="w-full rounded-lg bg-gray-50 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500" />
    </div>

    <!-- მისამართი -->
    <div>
        <label class="block text-xs text-gray-500 mb-1">მდებარეობა</label>
        <input type="text" placeholder="ქალაქი / მისამართი" formControlName="location"
            class="w-full rounded-lg bg-gray-50 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500" />
    </div>

    <!-- ბანკის არჩევა -->
    <div>
        <label class="block text-xs text-gray-500 mb-1">აირჩიე ბანკი</label>
        <select formControlName="bank"
            class="w-full rounded-lg bg-gray-50 border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-gray-500">
            <option disabled selected>საქართველოს ბანკი</option>
            <option>თიბისი ბანკი</option>
            <option>ლიბერთი ბანკი</option>
        </select>
    </div>

    <!-- ბანკის ინფორმაცია -->
    <div class="rounded-xl bg-gray-50 border border-gray-300 p-3 space-y-1">
        <p class="text-xs text-gray-500">ანგარიშის ნომერი</p>
        <div class="flex justify-between">
            <p class="font-medium text-sm tracking-wide">
                GE46BG0000000594874016
            </p>

            <button type="button" class="text-xs text-blue-600 cursor-pointer">
                📋 დაკოპირება
            </button>
        </div>
    </div>

    <!-- ქვითრის ატვირთვა -->
    <div>
        <label class="block text-xs text-gray-500 mb-1">
            გადახდის ქვითარი
        </label>

        <input type="file" accept="image/*" (change)="onFileChange($event)" class="w-full text-sm text-gray-600
             file:mr-3 file:py-1.5 file:px-3
             file:rounded-lg file:border
             file:border-gray-300
             file:bg-gray-50 file:text-gray-700
             hover:file:bg-gray-100 transition" />
    </div>

    <!-- დადასტურება -->
    <div class="flex items-start gap-2 pt-2">
        <input type="checkbox" class="mt-0.5 accent-gray-700" formControlName="terms" />
        <p class="text-xs text-gray-600">
            ვეთანხმები მომსახურების პირობებს და კონფიდენციალურობის პოლიტიკას
        </p>
    </div>

    <button type="submit" class="btn-primary w-full disabled:opacity-50 disabled:cursor-not-allowed"   [disabled]="checkoutForm.invalid">
        შეკვეთის დასრულება
    </button>
</form>
