<div class="mx-auto">
    <input type="file" #fileInput multiple (change)="onFileSelected($event)" class="hidden" accept="image/*">
    <div (click)="fileInput.click()"
        class="border-2 border-dashed border-purple-200  hover:opacity-80 bg-purple-50 transition-colors rounded-3xl p-6 flex flex-col items-center justify-center cursor-pointer mb-8 group">
        <div class="w-12 h-12 bg-purple-100 text-indigo-900 rounded-2xl flex items-center justify-center mb-4">
            <fa-icon [icon]="faImage" class="text-2xl"></fa-icon>
        </div>
        <span class="text-indigo-900 font-bold text-md">ატვირთე ფოტოები აქედან</span>
    </div>

    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-900">ატვირთული ფოტოები</h2>
    </div>

    <div class="flex gap-2 overflow-x-scroll" style="scrollbar-width: none;">
        @for (photo of photos; track photo) {
        <div class="relative group">
            <div class="w-36 h-36 rounded-2xl overflow-hidden shadow-sm border border-gray-100">
                <img [src]="photo.url" alt="Uploaded photo" class="w-full h-full object-cover">
            </div>
        </div>
        }
    </div>

</div>
